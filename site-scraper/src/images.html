<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Site Scraper – Download images</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="crawler">
  <h1>Download images as ZIP</h1>
  <p id="source" class="muted"></p>

  <div class="row">
    <button id="startBtn" class="primary" disabled>Download ZIP</button>
    <button id="stopBtn" disabled>Cancel</button>
  </div>

  <p id="status" class="muted"></p>
  <progress id="progress" value="0" max="1" class="hidden"></progress>

  <h2>Log</h2>
  <div id="log" class="log"></div>

  <script src="export.js"></script>
  <script src="zip.js"></script>
  <script src="imagezip.js"></script>
  <script src="images.js"></script>
</body>
</html>
